# ============================================================================
# .github/workflows/generate-content.yml
# ============================================================================
# Daily newspaper content generation via LangChain + LangGraph.
#
# TUTORIAL: GitHub Actions Self-Hosted Runner
# ============================================
# This workflow runs on YOUR HOME MACHINE rather than GitHub's cloud runners.
# That means:
#   ✓ LM Studio on localhost:1234 is accessible
#   ✓ No per-minute billing for compute
#   ✓ Your AWS + AI API keys stay in GitHub Secrets (encrypted)
#   ✓ The runner pulls the job over HTTPS — your machine initiates the connection
#
# To set up the self-hosted runner:
#   1. Go to GitHub repo → Settings → Actions → Runners → "New self-hosted runner"
#   2. Follow the instructions to download and configure the runner on your Mac
#   3. Start it with: ./run.sh
#   4. For auto-start on boot: ./svc.sh install && ./svc.sh start
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY          — Claude API key (console.anthropic.com)
#   GOOGLE_API_KEY             — Gemini API key (aistudio.google.com)
#   AWS_ACCESS_KEY_ID          — AWS IAM user with S3 put permissions
#   AWS_SECRET_ACCESS_KEY      — Corresponding secret
#   CLOUDFRONT_DISTRIBUTION_ID — Optional: for cache invalidation after publish
#
# Required GitHub Variables (Settings → Variables → Actions):
#   S3_BUCKET                  — e.g. craicgpt-ie-production
#   WEATHER_LOCATION           — e.g. Dublin
# ============================================================================

name: Generate Daily Craic

on:
  # Run every morning at 06:00 UTC (07:00 Irish time, before most people wake up).
  schedule:
    - cron: "0 6 * * *"

  # Allow manual runs from the GitHub Actions UI with an optional date override.
  # TUTORIAL: workflow_dispatch is essential for testing and re-generating content.
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
      dry_run:
        description: "Dry run — generate but don't upload to S3"
        required: false
        default: false
        type: boolean
      skip_local_llm:
        description: "Skip local LM Studio provider"
        required: false
        default: false
        type: boolean

jobs:
  generate:
    name: Generate Newspaper Content

    # TUTORIAL: self-hosted means this job runs on a machine you control.
    # The runner agent must be installed, configured, and running on your home Mac.
    # See setup instructions above.
    runs-on: self-hosted

    # Prevent parallel runs — one edition per day is enough craic.
    # TUTORIAL: concurrency with cancel-in-progress=false queues a second run
    # rather than cancelling it. Use cancel-in-progress=true for long pipelines
    # where a newer commit should supersede an older one.
    concurrency:
      group: generate-${{ github.ref }}
      cancel-in-progress: false

    # Cap the job at 30 minutes — if the pipeline hangs, fail fast.
    timeout-minutes: 30

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Only fetch the latest commit — we don't need full history here.
          fetch-depth: 1

      # ─── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache pip dependencies keyed on requirements.txt hash.
          # TUTORIAL: Caching saves ~30 seconds per run — LangChain has many deps.
          cache: "pip"
          cache-dependency-path: content_pipeline/requirements.txt

      # ─── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r content_pipeline/requirements.txt

      # ─── 4. Run the pipeline ────────────────────────────────────────────────
      # TUTORIAL: Environment variables inject secrets at runtime.
      # Secrets are never written to disk or printed in logs (GitHub masks them).
      - name: Run content generation pipeline
        env:
          # ── LLM API keys ──────────────────────────────────────────────────────
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          # ── Local LM Studio ───────────────────────────────────────────────────
          # The self-hosted runner runs on the same machine as LM Studio,
          # so localhost:1234 works without any tunneling.
          LM_STUDIO_BASE_URL: "http://localhost:1234/v1"
          LM_STUDIO_MODEL: "local-model"

          # ── AWS (for S3 upload) ───────────────────────────────────────────────
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "eu-west-1"
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

          # ── Pipeline behaviour ────────────────────────────────────────────────
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SKIP_LOCAL_LLM: ${{ inputs.skip_local_llm || 'false' }}
          WEATHER_LOCATION: ${{ vars.WEATHER_LOCATION || 'Dublin' }}
          LOG_LEVEL: "INFO"

        # Pass the optional date as a positional argument (empty string = today).
        run: |
          python content_pipeline/main.py ${{ inputs.date || '' }}

      # ─── 5. Workflow summary ─────────────────────────────────────────────────
      # TUTORIAL: GitHub Actions Job Summary lets you write Markdown to the
      # workflow run page — much friendlier than hunting through raw logs.
      - name: Write job summary
        if: always()
        run: |
          echo "## Craic Gazette Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Date | ${{ inputs.date || 'today' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | ${{ inputs.dry_run || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skip local LLM | ${{ inputs.skip_local_llm || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | ${{ runner.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
