name: Deploy Backend Lambda Functions

on:
  push:
    branches: [main, develop]
    paths:
      - 'lambda_code/**'
      - 'terraform/backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'lambda_code/**'
      - 'terraform/backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

env:
  AWS_REGION: eu-west-1
  TF_VERSION: 1.8.0

jobs:
  # Job to detect which Lambda functions have changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      lambda-functions: ${{ steps.changes.outputs.lambda-functions }}
      terraform-changed: ${{ steps.changes.outputs.terraform-changed }}
      all-functions: ${{ steps.list-functions.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Lambda functions
        id: changes
        run: |
          # Get changed files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi
          
          # Detect changed Lambda functions
          LAMBDA_FUNCTIONS=$(echo "$CHANGED_FILES" | grep '^lambda_code/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          TERRAFORM_CHANGED=$(echo "$CHANGED_FILES" | grep -q '^terraform/backend/' && echo "true" || echo "false")
          
          echo "lambda-functions=$LAMBDA_FUNCTIONS" >> $GITHUB_OUTPUT
          echo "terraform-changed=$TERRAFORM_CHANGED" >> $GITHUB_OUTPUT
          
          echo "Changed Lambda functions: $LAMBDA_FUNCTIONS"
          echo "Terraform changed: $TERRAFORM_CHANGED"

      - name: List all Lambda functions
        id: list-functions
        run: |
          FUNCTIONS=$(ls lambda_code/ | jq -R -s -c 'split("\n")[:-1]')
          echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT

  # Validate and test Lambda functions
  validate-lambda:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.lambda-functions != '[]' || needs.detect-changes.outputs.terraform-changed == 'true'
    strategy:
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.lambda-functions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies for ${{ matrix.function }}
        run: |
          cd lambda_code/${{ matrix.function }}
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install boto3 pytest flake8

      - name: Lint Lambda function
        run: |
          cd lambda_code/${{ matrix.function }}
          flake8 --max-line-length=120 --ignore=E501,W503 *.py || true

      - name: Test Lambda function
        run: |
          cd lambda_code/${{ matrix.function }}
          # Run tests if they exist
          if [ -f test_*.py ] || [ -d tests/ ]; then
            python -m pytest -v
          else
            # Basic syntax check
            python -m py_compile *.py
          fi

    # Deploy to dev environment
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-lambda]
    if: always() && (needs.validate-lambda.result == 'success' || needs.validate-lambda.result == 'skipped') && (github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create Lambda packages
        run: |
          # Create packages for all Lambda functions
          for function_dir in lambda_code/*/; do
            function_name=$(basename "$function_dir")
            echo "Packaging $function_name..."
            
            cd "$function_dir"
            
            # Install dependencies if requirements.txt exists
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt -t .
            fi
            
            # Create zip package
            zip -r "../${function_name}.zip" . \
              -x "*.pyc" "*__pycache__*" "*.git*" "test_*" "tests/*" \
              "requirements.txt" "*.md" "*.txt"
            
            cd - > /dev/null
          done

             - name: Terraform Init
         run: |
           cd terraform/backend
           terraform init \
             -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
             -backend-config="key=backend/dev/terraform.tfstate" \
             -backend-config="region=${{ env.AWS_REGION }}"

       - name: Terraform Plan
         run: |
           cd terraform/backend
           terraform plan \
             -var-file="environments/dev.tfvars" \
             -out=tfplan \
             -detailed-exitcode
         continue-on-error: true

       - name: Terraform Apply
         if: github.event_name != 'pull_request'
         run: |
           cd terraform/backend
           terraform apply -auto-approve tfplan

       - name: Output Lambda Function ARNs
         if: github.event_name != 'pull_request'
         run: |
           cd terraform/backend
           terraform output -json > ../../lambda-outputs-dev.json

       - name: Upload deployment artifacts
         if: github.event_name != 'pull_request'
         uses: actions/upload-artifact@v4
         with:
           name: lambda-deployment-dev
           path: |
             lambda-outputs-dev.json
             lambda_code/*.zip

  # Deploy to test environment
  deploy-test:
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-lambda]
    if: always() && (needs.validate-lambda.result == 'success' || needs.validate-lambda.result == 'skipped') && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create Lambda packages
        run: |
          # Create packages for all Lambda functions
          for function_dir in lambda_code/*/; do
            function_name=$(basename "$function_dir")
            echo "Packaging $function_name..."
            
            cd "$function_dir"
            
            # Install dependencies if requirements.txt exists
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt -t .
            fi
            
            # Create zip package
            zip -r "../${function_name}.zip" . \
              -x "*.pyc" "*__pycache__*" "*.git*" "test_*" "tests/*" \
              "requirements.txt" "*.md" "*.txt"
            
            cd - > /dev/null
          done

      - name: Terraform Init
        run: |
          cd terraform/backend
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=backend/test/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        run: |
          cd terraform/backend
          terraform plan \
            -var-file="environments/test.tfvars" \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: Terraform Apply
        run: |
          cd terraform/backend
          terraform apply -auto-approve tfplan

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deployment-test
          path: |
            lambda_code/*.zip

  # Deploy to prod environment
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-lambda]
    if: always() && (needs.validate-lambda.result == 'success' || needs.validate-lambda.result == 'skipped') && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create Lambda packages
        run: |
          # Create packages for all Lambda functions
          for function_dir in lambda_code/*/; do
            function_name=$(basename "$function_dir")
            echo "Packaging $function_name..."
            
            cd "$function_dir"
            
            # Install dependencies if requirements.txt exists
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt -t .
            fi
            
            # Create zip package
            zip -r "../${function_name}.zip" . \
              -x "*.pyc" "*__pycache__*" "*.git*" "test_*" "tests/*" \
              "requirements.txt" "*.md" "*.txt"
            
            cd - > /dev/null
          done

      - name: Terraform Init
        run: |
          cd terraform/backend
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=backend/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        run: |
          cd terraform/backend
          terraform plan \
            -var-file="environments/prod.tfvars" \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: Terraform Apply
        run: |
          cd terraform/backend
          terraform apply -auto-approve tfplan

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deployment-prod
          path: |
            lambda_code/*.zip 